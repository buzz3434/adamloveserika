name: Daily photo update

on:
  schedule:
    # Runs every day at 09:00 UTC (about 1am/2am Pacific, adjust as you like).
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's site
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python generate.py

      - name: Commit and push if changed
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add index.html photo/current.jpg
          git diff --quiet --cached || git commit -m "Daily update: $(date -u +%Y-%m-%d)"
          git push
