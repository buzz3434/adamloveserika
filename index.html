<!DOCTYPE html>

<head>

<title>Adam &amp; Erika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&family=Parisienne&family=Marcellus&family=Playfair+Display:wght@600;700&family=Poppins:wght@500;600&family=Montserrat:wght@600&family=Cormorant+Garamond:wght@600;700&display=swap">
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;   /* guarantees no scrollbars, ever */
  }
  body {
    position: relative;
    background-image: url("/photo/current.jpg?v=836225d9e8");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    height: 100vh;
    width: 100vw;
    /* 100dvh accounts for mobile browser address bars so the photo
       still fills the true visible screen with no gap or scroll */
    height: 100dvh;
  }
  .caption-box {
    position: absolute;
    left: 8.0%;
    top: 52.0%;
    width: 28.0%;
    height: 13.0%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2%;
    text-align: center;
  }
  .caption-box h1 {
    font-family: 'Great Vibes', cursive;
    font-weight: 400;
    color: #e3d9ff;
    font-size: clamp(1.6rem, 3.15vmin, 9rem);
    line-height: 1.15;
    margin: 0;
    text-shadow: 0 2px 14px rgba(0,0,0,0.20);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="caption-box">
    <h1>Adam loves Erika</h1>
  </div>
